<!DOCTYPE html>  
<html lang="ku" dir="rtl">  
<head>  
  <meta charset="UTF-8" />  
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />  
  <link rel="preconnect" href="https://fonts.googleapis.com" />  
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />  
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />  
  <title>hama tech - سەکۆی تەکنەلۆژیای پێشکەوتوو</title>  
  <style>  
    :root {  
      --success-400: #34d399;  
      --success-500: #10b981;  
      --accent-500: #a855f7;  
  
      --font-display: 'Tajawal', 'Vazirmatn', sans-serif;  
      --font-body: 'Vazirmatn', 'Tajawal', sans-serif;  
  
      --glass-blur: 20px;  
      --radius-sm: 0.5rem;  
      --radius-md: 1rem;  
      --radius-lg: 1.5rem;  
      --radius-xl: 2rem;  
      --radius-2xl: 2.5rem;  
      --radius-full: 9999px;  
  
      --transition-fast: 0.3s cubic-bezier(0.4, 0, 0.2, 1);  
      --transition-base: 0.6s cubic-bezier(0.16, 1, 0.3, 1);  
      --transition-slow: 1s cubic-bezier(0.16, 1, 0.3, 1);  

      --neutral-0: #ffffff;  
      --neutral-100: #f1f1f1;  
      --neutral-200: #d1d1d1;  
      --neutral-300: #a3a3a3;  
      --neutral-400: #737373;  
      --neutral-900: #0f0f0f;  
      --neutral-950: #030303;  
  
      --glass-bg: rgba(15, 15, 15, 0.85);  
      --glass-bg-strong: rgba(22, 22, 22, 0.95);  
      --glass-border: rgba(255, 255, 255, 0.08);  
  
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.6);  
      --shadow-md: 0 8px 32px rgba(0, 0, 0, 0.8);  
      --shadow-lg: 0 20px 60px rgba(0, 0, 0, 0.9);  
      --shadow-glow: 0 0 40px rgba(168, 85, 247, 0.2);  
    }  
  
    body {  
      background: linear-gradient(135deg, #050505 0%, #000000 50%, #080808 100%);  
      color: var(--neutral-100);  
      font-family: var(--font-body);   
      width: 100%;   
      overflow-x: hidden;   
      line-height: 1.6;  
      padding-bottom: 110px;
    }  
  
    * { margin: 0; padding: 0; box-sizing: border-box; }  
    html { scroll-behavior: smooth; width: 100%; overflow-x: hidden; }  
    h1, h2, h3, h4, h5, h6 { font-family: var(--font-display); font-weight: 700; line-height: 1.25; }  
    a { color: inherit; text-decoration: none; }  
    button { font-family: inherit; cursor: pointer; border: none; background: none; }  
    img { max-width: 100%; display: block; }  

    .intro-splash-screen {
      position: fixed; inset: 0;
      background: radial-gradient(circle at center, #0a192f 0%, #02060f 70%, #000000 100%);
      z-index: 99999; display: flex; align-items: center; justify-content: center;
      animation: splashFadeOut 1s ease 4s forwards; pointer-events: none;
    }

    .intro-logo-container {
      position: relative; width: 220px; height: 220px; border-radius: 50%; overflow: hidden;
      animation: logoExpandAndReveal 4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      box-shadow: 0 0 80px rgba(0, 162, 255, 0.4);
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .intro-logo-img { width: 100%; height: 100%; object-fit: cover; }

    .intro-logo-container::after {
      content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
      background: linear-gradient(to right, rgba(255, 255, 255, 0) 0%, rgba(255, 255, 255, 0.95) 50%, rgba(255, 255, 255, 0) 100%);
      transform: rotate(30deg) translateX(-100%);
      animation: whiteGlowSweep 2s ease-in-out 0.5s infinite;
    }

    @keyframes whiteGlowSweep {
      0% { transform: rotate(30deg) translateX(-100%); }
      100% { transform: rotate(30deg) translateX(100%); }
    }

    @keyframes logoExpandAndReveal {
      0% { transform: scale(0.4); opacity: 0; }
      20% { transform: scale(1.05); opacity: 1; box-shadow: 0 0 100px rgba(255, 255, 255, 0.8); }
      85% { transform: scale(1); opacity: 1; box-shadow: 0 0 60px rgba(0, 162, 255, 0.6); }
      100% { transform: scale(4.5); opacity: 0; box-shadow: 0 0 150px rgba(255, 255, 255, 0); }
    }

    @keyframes splashFadeOut {
      0% { opacity: 1; visibility: visible; }
      100% { opacity: 0; visibility: hidden; }
    }
  
    .bg-animated {  
      position: fixed; inset: 0; z-index: -2;  
      background: radial-gradient(circle at 50% 10%, rgba(30, 30, 30, 0.4) 0%, transparent 60%), var(--neutral-950);  
    }  

    .bg-blobs { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }  
    .bg-blob { position: absolute; border-radius: 50%; filter: blur(140px); opacity: 0.15; animation: float 25s ease-in-out infinite; }  
    .bg-blob-1 { width: 700px; height: 700px; background: radial-gradient(circle, #555555, transparent 70%); top: -20%; left: -10%; }  
    .bg-blob-2 { width: 800px; height: 800px; background: radial-gradient(circle, #222222, transparent 70%); bottom: -20%; right: -10%; }  
  
    @keyframes float {  
      0%, 100% { transform: translate(0, 0) scale(1); }  
      33% { transform: translate(30px, -40px) scale(1.05); }  
      66% { transform: translate(-20px, 30px) scale(0.95); }  
    }  

    .container { width: 100%; max-width: 1280px; margin: 0 auto; padding: 0 1rem; }  
  
    .btn {  
      display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem;  
      padding: 0.75rem 1.5rem; border-radius: var(--radius-full); font-weight: 600; font-size: 0.95rem;  
      transition: all var(--transition-base); white-space: nowrap; font-family: var(--font-display);  
    }  
    .btn-primary {  
      background: linear-gradient(135deg, #7e22ce, #9333ea);  
      color: white; box-shadow: var(--shadow-glow);  
    }  
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 0 30px rgba(147, 51, 234, 0.4); }  

    .navbar-white-box {
      background: #ffffff;
      color: #0f0f0f;
      border-radius: var(--radius-full);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.6rem 1rem;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(0, 0, 0, 0.08);
    }
    .brand-name-black {
      font-weight: 800; font-size: 1.1rem; color: #0f0f0f; text-transform: lowercase;
    }

    .input[type = "text"] {
      display: block; color: #0f0f0f; background: #f3f3f5;
      box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.06);
      border: 1.5px solid rgba(0, 0, 0, 0.1);
      border-radius: 50px; height: 38px; margin: 0 auto; padding: 8px 14px;
      outline: none; text-align: center; width: 100%; max-width: 250px;
      transition: 0.3s ease;
      font-size: 0.85rem;
    }
    .input[type = "text"]::placeholder { color: #737373; }
    .input[type = "text"]:focus { border-color: #9333ea; background: #ffffff; box-shadow: 0 0 20px rgba(147, 51, 234, 0.2); }

    .hero-banner-section {
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      padding: 0; width: 100%; min-height: 320px; background: transparent; border: none; box-shadow: none;
      margin-top: 1rem; margin-bottom: 2rem; position: relative; overflow: hidden;
    }

    .hero-slider-container { position: relative; width: 100%; height: 320px; display: flex; align-items: center; justify-content: center; }

    .hero-slide-card {
      width: 100%; height: 100%; background: transparent; border: none; border-radius: 0; padding: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
      box-shadow: none; animation: fadeInOut 0.6s ease-in-out; position: relative;
    }

    @keyframes fadeInOut { from { opacity: 0; transform: scale(0.97); } to { opacity: 1; transform: scale(1); } }

    .hero-slide-img-wrap { position: absolute; inset: 0; width: 100%; height: 100%; border-radius: var(--radius-2xl); overflow: hidden; background: #000; z-index: 1; }
    .hero-slide-img { width: 100%; height: 100%; object-fit: cover; filter: brightness(0.65); }
    .hero-slide-title { font-size: 1.6rem; font-weight: 900; color: var(--neutral-0); margin-bottom: 0.4rem; z-index: 2; text-shadow: 0 4px 15px rgba(0,0,0,0.9); padding: 0 1rem; }
    .hero-slide-sub { font-size: 0.95rem; color: var(--neutral-100); font-weight: 600; z-index: 2; text-shadow: 0 2px 10px rgba(0,0,0,0.9); padding: 0 1rem; }

    .slider-nav-arrow {
      position: absolute; top: 50%; transform: translateY(-50%); background: rgba(15, 15, 15, 0.7);
      color: white; border: 1px solid rgba(255, 255, 255, 0.2); width: 38px; height: 38px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 10; transition: all 0.3s ease; font-size: 1.2rem; box-shadow: 0 4px 15px rgba(0,0,0,0.6);
    }
    .slider-nav-arrow:hover { background: #9333ea; border-color: #9333ea; transform: translateY(-50%) scale(1.1); }
    .slider-nav-arrow.prev-arrow { right: 12px; }
    .slider-nav-arrow.next-arrow { left: 12px; }

    .mid-featured-section {
      width: 100%;
      background: linear-gradient(135deg, rgba(25, 25, 30, 0.9), rgba(10, 10, 12, 0.95));
      border: 1.5px solid rgba(147, 51, 234, 0.4);
      border-radius: var(--radius-2xl);
      padding: 1.75rem 1rem;
      margin: 2rem 0;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 30px rgba(147, 51, 234, 0.2);
    }
    .mid-featured-header {
      text-align: center;
      margin-bottom: 1.25rem;
    }
    .mid-featured-title { font-size: 1.3rem; font-weight: 900; color: #fff; margin-bottom: 0.3rem; }
    .mid-featured-sub { font-size: 0.82rem; color: var(--neutral-300); line-height: 1.4; padding: 0 0.5rem; }

    .mid-featured-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 0.75rem;
    }
    .mid-featured-item {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: var(--radius-lg);
      padding: 0.75rem 0.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      transition: all 0.3s ease;
      cursor: pointer;
    }
    .mid-featured-item:hover {
      transform: translateY(-4px);
      border-color: #9333ea;
      box-shadow: 0 10px 25px rgba(147, 51, 234, 0.3);
    }
    .mid-featured-img-box {
      width: 100%;
      aspect-ratio: 1/1;
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 0.5rem;
      background: #000;
    }
    .mid-featured-img { width: 100%; height: 100%; object-fit: cover; }
    .mid-featured-name { font-size: 0.82rem; font-weight: 700; color: #fff; margin-bottom: 0.2rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; }
    .mid-featured-price { font-size: 0.82rem; font-weight: 800; color: #34d399; }

    .bottom-dock-wrapper { 
      position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%); 
      z-index: 999; width: calc(100% - 16px); max-width: 500px;
    }
    
    .dock-bar-inner {
      display: flex; background-color: rgba(12, 12, 12, 0.95); backdrop-filter: blur(25px); 
      -webkit-backdrop-filter: blur(25px); height: 60px; align-items: center; justify-content: space-evenly;
      border-radius: 35px; border: 1.5px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.9); padding: 0 6px; gap: 4px; width: 100%;
    }

    .button {
      outline: 0 !important; border: 0 !important; width: 38px; height: 38px; min-width: 38px;
      border-radius: 50%; background-color: rgba(255, 255, 255, 0.05); display: flex; 
      align-items: center; justify-content: center; color: #f1f1f1;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); cursor: pointer; 
      box-shadow: 0 4px 10px rgba(0,0,0,0.3); position: relative;
    }
    .button:hover, .button.active-dock { 
      transform: translateY(-3px) scale(1.08); background-color: #9333ea; color: #ffffff; 
      box-shadow: 0 8px 20px rgba(147, 51, 234, 0.5); 
    }
    
    .button.home-center-btn {
      width: 44px; height: 44px; min-width: 44px;
      background: linear-gradient(135deg, #7e22ce, #9333ea); color: #ffffff;
      box-shadow: 0 4px 18px rgba(147, 51, 234, 0.6);
    }
    .button.home-center-btn:hover, .button.home-center-btn.active-dock {
      background: linear-gradient(135deg, #6b21a8, #7e22ce);
      transform: translateY(-4px) scale(1.1);
      box-shadow: 0 8px 25px rgba(147, 51, 234, 0.8);
    }

    .icon { font-size: 17px; }

    .floating-lang-menu { position: fixed; bottom: 82px; left: 16px; z-index: 999; width: 48px; height: 48px; }
    .button-menu { cursor: pointer; position: absolute; z-index: 1; background-color: #080808; border: 2px solid rgba(255, 255, 255, 0.3); color: #ffffff; font-size: 18px; width: 48px; height: 48px; border-radius: 50%; display: flex; justify-content: center; align-items: center; box-shadow: 0px 8px 25px rgba(0, 0, 0, 0.9); transition: all 0.3s ease; }
    .checkbox { width: 48px; height: 48px; opacity: 0; z-index: 10; cursor: pointer; position: absolute; }
    .option { position: absolute; background-color: #080808; border: 2px solid rgba(255, 255, 255, 0.2); color: #ffffff; z-index: -1; width: 42px; height: 42px; border-radius: 50%; cursor: pointer; font-weight: 700; font-size: 0.75rem; display: flex; align-items: center; justify-content: center; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: 3px 3px 15px rgba(0, 0, 0, 0.8); }
    .checkbox:hover ~ .button-menu, .checkbox:checked ~ .button-menu { background-color: #1a1a1a; border-color: #9333ea; color: #ffffff; transform: scale(0.98); }
    .checkbox:not(:checked) ~ .button-menu::before { content: "🌐"; }
    .checkbox:checked ~ .button-menu::after { content: "✕"; color: #9333ea; }
    .option:hover { background-color: #9333ea; color: #ffffff; border-color: #ffffff; transform: scale(1.08); }
    .checkbox:checked ~ .option-a { transition-delay: 0.1s; transform: translateY(-60px); }
    .checkbox:checked ~ .option-b { transition-delay: 0.2s; transform: translateY(-45px) translateX(48px); }
    .checkbox:checked ~ .option-c { transition-delay: 0.3s; transform: translateX(60px); }

    .products-section { padding: 0.5rem 0 2rem; width: 100%; }
    .products-glass-container {
      background: rgba(15, 15, 15, 0.85); backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08); border-radius: var(--radius-2xl);
      padding: 1.25rem 0.75rem; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.9); width: 100%;
    }
    .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 0.85rem; width: 100%; }
  
    @keyframes smoothAppear { 0% { opacity: 0; transform: translateY(20px) scale(0.98); } 100% { opacity: 1; transform: translateY(0) scale(1); } }
    @keyframes panAnimation { 0% { object-position: 0% 50%; } 50% { object-position: 100% 50%; } 100% { object-position: 0% 50%; } }  
  
    .product-card {
      border-radius: var(--radius-lg); overflow: hidden; transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex; flex-direction: column; background: rgba(22, 22, 22, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.08); position: relative; width: 100%;
      animation: smoothAppear 0.5s ease forwards;
    }
    .product-card:hover { 
      transform: translateY(-5px) scale(1.01); 
      box-shadow: 0 0 25px rgba(147, 51, 234, 0.35), 0 10px 25px rgba(0, 0, 0, 0.9); 
      border-color: rgba(147, 51, 234, 0.5); 
    }
    .product-image-wrapper { position: relative; overflow: hidden; aspect-ratio: 16 / 10; background: var(--neutral-900); }
    .product-image { width: 100%; height: 100%; object-fit: cover; animation: panAnimation 12s ease-in-out infinite alternate; transition: transform var(--transition-slow); cursor: pointer; }
    .product-card:hover .product-image { transform: scale(1.08); }
    .product-badge {
      position: absolute; top: 0.5rem; inset-inline-start: 0.5rem; padding: 0.15rem 0.5rem;
      border-radius: var(--radius-full); font-size: 0.65rem; font-weight: 700; color: white; background: #9333ea; z-index: 2;
      box-shadow: 0 0 10px rgba(147, 51, 234, 0.5);
    }
    
    .product-discount-badge {
      position: absolute; top: 0.5rem; inset-inline-end: 0.5rem; padding: 0.15rem 0.5rem;
      border-radius: var(--radius-full); font-size: 0.68rem; font-weight: 800; color: white; background: #dc2626; z-index: 2;
      box-shadow: 0 0 12px rgba(220, 38, 38, 0.7);
    }

    .wishlist-btn {
      position: absolute; bottom: 0.5rem; inset-inline-end: 0.5rem;
      background: rgba(15, 15, 15, 0.75); border: 1px solid rgba(255, 255, 255, 0.2);
      color: white; width: 30px; height: 30px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 5;
      transition: all 0.3s ease;
    }
    .wishlist-btn:hover { background: #dc2626; border-color: #dc2626; transform: scale(1.1); }
  
    .slider-arrow {
      position: absolute; top: 50%; transform: translateY(-50%); background: rgba(0, 0, 0, 0.7);
      color: white; border: 1px solid rgba(255, 255, 255, 0.2); width: 26px; height: 26px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 10; opacity: 0; transition: opacity 0.2s;
    }
    .product-image-wrapper:hover .slider-arrow { opacity: 1; }
    .slider-arrow:hover { background: #9333ea; }
    .slider-arrow.prev { left: 5px; }
    .slider-arrow.next { right: 5px; }  
  
    .product-content { padding: 0.85rem; display: flex; flex-direction: column; gap: 0.4rem; flex: 1; }
    .product-rating { display: flex; align-items: center; gap: 0.3rem; color: #d8b4fe; font-size: 0.75rem; font-weight: 700; }
    .product-name { font-size: 0.95rem; font-weight: 700; color: var(--neutral-0); cursor: pointer; transition: color 0.2s; }
    .product-name:hover { color: #d8b4fe; }
    .product-specs { display: flex; flex-wrap: wrap; gap: 0.25rem; }
    .product-spec {
      padding: 0.1rem 0.4rem; border-radius: var(--radius-sm); font-size: 0.65rem;
      color: var(--neutral-200); background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .product-bottom { display: flex; align-items: center; justify-content: space-between; margin-top: auto; padding-top: 0.4rem; }
    .product-prices { display: flex; align-items: baseline; gap: 0.3rem; }
    .product-price { font-size: 1.1rem; font-weight: 800; color: var(--neutral-0); }
    .product-old-price { font-size: 0.8rem; color: var(--neutral-400); text-decoration: line-through; }
  
    @keyframes fadeAndScaleIn {
      0% { opacity: 0; transform: scale(0.92) translateY(10px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0, 0, 0, 0.92); backdrop-filter: blur(16px);
      z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 0.75rem;
      pointer-events: auto;
      animation: fadeInModal 0.3s ease forwards;
    }
    @keyframes fadeInModal { from { opacity: 0; } to { opacity: 1; } }

    .daring-details-container {
      background: #0d0d0f;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      padding: 1.25rem;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 25px 60px rgba(0,0,0,0.9);
      position: relative;
      color: var(--neutral-0);
      max-height: 85vh;
      overflow-y: auto;
      animation: fadeAndScaleIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .daring-close-btn {
      position: absolute; top: 0.85rem; inset-inline-end: 0.85rem;
      background: rgba(255, 255, 255, 0.08); color: var(--neutral-200);
      width: 30px; height: 30px; border-radius: 50%; display: flex;
      align-items: center; justify-content: center; cursor: pointer; font-size: 0.95rem; z-index: 10;
    }
    .daring-close-btn:hover { background: #9333ea; color: white; }

    .daring-img-box {
      width: 100%; aspect-ratio: 1/1; background: #fff; border-radius: 12px;
      overflow: hidden; display: flex; align-items: center; justify-content: center; margin-bottom: 0.85rem;
      position: relative;
    }
    .daring-img { width: 100%; height: 100%; object-fit: contain; }

    .daring-thumbs {
      display: flex; gap: 0.4rem; justify-content: center; margin-bottom: 0.85rem;
    }
    .daring-thumb {
      width: 42px; height: 42px; border-radius: 8px; border: 2px solid rgba(255,255,255,0.15);
      overflow: hidden; cursor: pointer; background: #fff;
    }
    .daring-thumb.active { border-color: #9333ea; }
    .daring-thumb img { width: 100%; height: 100%; object-fit: cover; }

    .daring-breadcrumb {
      font-size: 0.75rem; color: var(--neutral-400); margin-bottom: 0.6rem; display: flex; gap: 0.3rem; align-items: center;
    }
    .daring-brand-logo-row {
      display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.5rem;
    }
    .daring-brand-logo-circle {
      width: 28px; height: 28px; border-radius: 50%; background: #000; border: 1px solid rgba(255,255,255,0.2);
      display: flex; align-items: center; justify-content: center; overflow: hidden;
    }
    .daring-brand-logo-circle img { width: 100%; height: 100%; object-fit: cover; }
    .daring-brand-text { font-size: 0.8rem; font-weight: 700; color: #a855f7; text-transform: uppercase; }

    .daring-title { font-size: 1.05rem; font-weight: 800; color: #fff; margin-bottom: 0.4rem; line-height: 1.3; }

      };  
  
      const handleDeleteProduct = (id) => {  
        setProducts(products.filter(p => p.id !== id));  
      };  

      const handleToggleLockProduct = (id) => {
        setProducts(products.map(p => p.id === id ? { ...p, isLocked: !p.isLocked } : p));
      };

      const handleAddHeroItem = (e) => {
        e.preventDefault();
        if (!newHeroTitle || !newHeroImage) return;
        const newHeroObj = {
          id: Date.now(),
          title: newHeroTitle,
          subtitle: newHeroSub || 'Pro Edition',
          img: newHeroImage
        };
        setCarouselImages([newHeroObj, ...carouselImages]);
        setNewHeroTitle(''); setNewHeroSub(''); setNewHeroImage('');
        alert('بە سەرکەوتوویی زیادکرا بۆ بەشی سەرەوە!');
      };

      const handleDeleteHeroItem = (id) => {
        setCarouselImages(carouselImages.filter(item => item.id !== id));
      };
  
      const handleAddToCart = (prod, qty = 1) => {  
        if (prod.isLocked) return;
        setCartItems(prev => {  
          const existing = prev.findIndex(item => item.product.id === prod.id);  
          if (existing > -1) {  
            const updated = [...prev];  
            updated[existing].quantity += qty;  
            return updated;  
          } else {  
            return [...prev, { product: prod, quantity: qty }];  
          }  
        });  
      };  

      const handleToggleWishlist = (prod) => {
        setWishlistItems(prev => {
          const exists = prev.some(item => item.id === prod.id);
          if (exists) {
            return prev.filter(item => item.id !== prod.id);
          } else {
            return [...prev, prod];
          }
        });
      };

      const updateQuantity = (productId, delta) => {
        setCartItems(prev => {
          return prev.map(item => {
            if (item.product.id === productId) {
              const newQty = item.quantity + delta;
              return newQty > 0 ? { ...item, quantity: newQty } : null;
            }
            return item;
          }).filter(Boolean);
        });
      };

      const handleWhatsAppOrder = (prodName, price, qty) => {
        let message = `🛒 *داواکاری نوێ لە hama tech*\n\n`;
        message += `▪️ ${prodName} (بڕ: ${qty}) - $${price * qty}\n`;
        const encodedMessage = encodeURIComponent(message);
        window.open(`https://wa.me/9647517283166?text=${encodedMessage}`, '_blank');
      };

      const handleWhatsAppCartOrder = () => {
        if (cartItems.length === 0) return;
        const total = cartItems.reduce((acc, item) => acc + (item.product.price * item.quantity), 0);
        let message = `🛒 *داواکاری سەبەتە لە hama tech*\n\n`;
        cartItems.forEach(item => {
          message += `▪️ ${item.product.name} (بڕ: ${item.quantity}) - $${item.product.price * item.quantity}\n`;
        });
        message += `\n💰 *کۆی گشتی: $${total}*\n`;
        if (fullName) message += `👤 ناو: ${fullName}\n`;
        if (address) message += `📍 ناونیشان: ${address}\n`;
        if (phone) message += `📞 مۆبایل: ${phone}\n`;

        const encodedMessage = encodeURIComponent(message);
        window.open(`https://wa.me/9647517283166?text=${encodedMessage}`, '_blank');
      };
  
      const filteredProducts = products.filter(prod => {  
        const query = searchQuery.trim().toLowerCase()
          .replace(/ي/g, 'ی')
          .replace(/ك/g, 'ک')
          .replace(/أ|إ|آ/g, 'ا');

        if (!query) return selectedCategory === 'All' || prod.category === selectedCategory;

        const prodName = prod.name.toLowerCase()
          .replace(/ي/g, 'ی')
          .replace(/ك/g, 'ک')
          .replace(/أ|إ|آ/g, 'ا');

        const prodCategory = prod.category.toLowerCase();
        const prodSpecs = prod.specs.join(' ').toLowerCase()
          .replace(/ي/g, 'ی')
          .replace(/ك/g, 'ک');

        const matchesSearch = prodName.includes(query) || prodCategory.includes(query) || prodSpecs.includes(query);  
        const matchesCategory = selectedCategory === 'All' || prod.category === selectedCategory;  
        return matchesSearch && matchesCategory;  
      });  
  
      const totalCartCount = cartItems.reduce((acc, item) => acc + item.quantity, 0);

      const featuredLaptop = products.find(p => p.category === 'Laptop') || products[0];
      const featuredMouse = products.find(p => p.category === 'Mouse') || products[3];
      const featuredHeadset = products.find(p => p.category === 'Headset') || products[11];
      const featuredKeyboard = products.find(p => p.category === 'Keyboard') || products[6];
      const fourFeaturedProducts = [featuredLaptop, featuredMouse, featuredHeadset, featuredKeyboard].filter(Boolean);

      return (  
        <div>  
          <header className="navbar" style={{ position: 'fixed', top: 0, left: 0, right: 0, zIndex: 100, padding: '0.4rem 0.5rem' }}>  
            <div className="container">  
              <div className="navbar-white-box">  
                <a href="#" className="brand" style={{ display: 'flex', alignItems: 'center', gap: '0.4rem' }}>  
                  <div className="brand-logo" style={{ width: '32px', height: '32px', borderRadius: '50%', overflow: 'hidden', border: '1px solid rgba(0,0,0,0.1)', background: '#000', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>  
                    <img src="logo.png" alt="logo" style={{ width: '100%', height: '100%', objectFit: 'cover' }} />  
                  </div>  
                  <span className="brand-name-black">{t.brandName}</span>  
                </a>  
  
                <div style={{ display: 'flex', alignItems: 'center', flex: 1, maxWidth: '320px', margin: '0 0.4rem' }}>  
                  <div style={{ position: 'relative', width: '100%', display: 'flex', justifyContent: 'center' }}>  
                    <input  
                      type="text"  
                      name="text"
                      className="input"  
                      placeholder={t.searchPlaceholder}  
                      value={searchQuery}  
                      onChange={(e) => setSearchQuery(e.target.value)}  
                    />  
                  </div>  
                </div>  
  
                <div style={{ display: 'flex', alignItems: 'center', gap: '0.4rem' }}>  
                  <button  
                    onClick={() => setIsCartOpen(true)}  
                    style={{  
                      position: 'relative', background: '#f3f3f5',  
                      border: '1px solid rgba(0, 0, 0, 0.1)', color: '#0f0f0f',  
                      width: '35px', height: '35px', borderRadius: '50%',  
                      display: 'flex', alignItems: 'center', justifyContent: 'center', cursor: 'pointer', transition: 'all 0.3s'  
                    }}  
                    title="سەبەتە"  
                  >  
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle r="1" cy="21" cx="9"></circle><circle r="1" cy="21" cx="20"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>  
                    {totalCartCount > 0 && (  
                      <span style={{  
                        position: 'absolute', top: '-3px', right: '-3px', background: '#9333ea',  
                        color: 'white', fontSize: '0.6rem', fontWeight: 'bold', width: '16px', height: '16px',  
                        borderRadius: '50%', display: 'flex', alignItems: 'center', justifyContent: 'center', boxShadow: '0 0 10px rgba(147, 51, 234, 0.6)'  
                      }}>  
                        {totalCartCount}  
                      </span>  
                    )}  
                  </button>  
                </div>  
              </div>  
            </div>  
          </header>  
  
          <div className="container" style={{ paddingTop: '4.8rem' }}>  
            <main className="content-area">  
              
              {carouselImages.length > 0 && (
                <section className="hero-banner-section">  
                  <div className="hero-slider-container">  
                    <button 
                      className="slider-nav-arrow prev-arrow" 
                      onClick={() => setActiveCarouselIndex(prev => (prev - 1 + carouselImages.length) % carouselImages.length)}
                      title="پێشوو"
                    >
                      ‹
                    </button>

                    <div className="hero-slide-card" key={carouselImages[activeCarouselIndex]?.id}>  
                      <div className="hero-slide-img-wrap">  
                        <img src={carouselImages[activeCarouselIndex]?.img} alt={carouselImages[activeCarouselIndex]?.title} className="hero-slide-img" />  
                      </div>  
                      <h4 className="hero-slide-title">{carouselImages[activeCarouselIndex]?.title}</h4>  
                      <span className="hero-slide-sub">{carouselImages[activeCarouselIndex]?.subtitle}</span>  
                    </div>  

                    <button 
                      className="slider-nav-arrow next-arrow" 
                      onClick={() => setActiveCarouselIndex(prev => (prev + 1) % carouselImages.length)}
                      title="دواتر"
                    >
                      ›
                    </button>
                  </div>  
                </section>  
              )}

              <div className="mid-featured-section">
                <div className="mid-featured-header">
                  <div className="mid-featured-title">✨ بەرهەمە هەڵبژاردراوەکان و ئۆفەری تایبەت</div>
                  <div className="mid-featured-sub">باشترین ئامێر و کەلوپەلی پیشکەوتوو بە کوالێتی بەرز و باشترین نرخ لە hama tech</div>
                </div>
                <div className="mid-featured-grid">
                  {fourFeaturedProducts.map(prod => (
                    <div key={prod.id} className="mid-featured-item" onClick={() => { setSelectedProductDetails(prod); setDetailsActiveImgIndex(0); setProductQuantity(1); }}>
                      <div className="mid-featured-img-box">
                        <img src={prod.images[0]} alt={prod.name} className="mid-featured-img" />
                      </div>
                      <div className="mid-featured-name">{prod.name}</div>
                      <div className="mid-featured-price">${prod.price}</div>
                    </div>
                  ))}
                </div>
              </div>

              <section className="products-section">  
                <div className="products-glass-container">  
                  <div className="container">  
                    <div className="products-grid">  
                      {filteredProducts.map(prod => {  
                        const currentImgIndex = activeImageIndices[prod.id] || 0;  
                        const activeImage = prod.images[currentImgIndex] || prod.images[0];  
                        const isWishlisted = wishlistItems.some(item => item.id === prod.id);
  
                        return (  
                          <div key={prod.id} className="product-card" onClick={() => { setSelectedProductDetails(prod); setDetailsActiveImgIndex(0); setProductQuantity(1); }}>  
                            <div className="product-image-wrapper">  
                              <span className="product-badge">{prod.badge}</span>  
                              {prod.discount > 0 && (
                                <span className="product-discount-badge">%{prod.discount} داشکاندن</span>
                              )}
                              <img src={activeImage} alt={prod.name} className="product-image" />  
                              
                              <button 
                                className="wishlist-btn" 
                                onClick={(e) => { e.stopPropagation(); handleToggleWishlist(prod); }}
                                title="دڵخواز"
                              >
                                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill={isWishlisted ? "#dc2626" : "none"} stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.04 3 5.5l7 7Z"></path></svg>
                              </button>

                              {prod.images.length > 1 && (  
                                <>  
                                  <button className="slider-arrow prev" onClick={(e) => { e.stopPropagation(); setActiveImageIndices(p => ({...p, [prod.id]: (currentImgIndex - 1 + prod.images.length) % prod.images.length})); }}>‹</button>  
                                  <button className="slider-arrow next" onClick={(e) => { e.stopPropagation(); setActiveImageIndices(p => ({...p, [prod.id]: (currentImgIndex + 1) % prod.images.length})); }}>›</button>  
                                </>  
                              )}  
                            </div>  
  
                            <div className="product-content">  
                              <div className="product-rating">  
                                <Icon name="star" size={12} style={{ fill: '#9333ea' }} />  
                                <span>{prod.rating}</span>  
                              </div>  
                              <h3 className="product-name">{prod.name}</h3>  
                              <div className="product-specs">  
                                {prod.specs.map((spec, i) => <span key={i} className="product-spec">{spec}</span>)}  
                              </div>  
                              <div className="product-bottom">  
                                <div className="product-prices">  
                                  <span className="product-price">${prod.price}</span>  
                                  {prod.oldPrice && <span className="product-old-price">${prod.oldPrice}</span>}  
                                </div>  
                                {prod.isLocked ? (
                                  <span style={{ fontSize: '0.68rem', fontWeight: 'bold', color: '#dc2626', background: 'rgba(220,38,38,0.1)', padding: '0.2rem 0.5rem', borderRadius: '5px' }}>{t.lockedProductText}</span>
                                ) : (
                                  <button className="btn btn-primary" style={{ padding: '0.4rem 0.8rem', fontSize: '0.8rem' }} onClick={(e) => { e.stopPropagation(); handleAddToCart(prod); }}>  
                                    <Icon name="shopping-cart" size={14} />  
                                  </button>  
                                )}
                              </div>  
                            </div>  
                          </div>  
                        );  
                      })}  
                    </div>  
                  </div>  
                </div>  
              </section>  
            </main>  
          </div>  
  
          <div className="bottom-dock-wrapper">  
            <div className="dock-bar-inner">  
              <button className="button" onClick={() => setIsAdminOpen(true)} title="بەڕێوەبەر">  
                <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" fill="currentColor" className="icon">  
                  <path d="M12 2.5a5.5 5.5 0 0 1 3.096 10.047 9.005 9.005 0 0 1 5.9 8.181.75.75 0 1 1-1.499.044 7.5 7.5 0 0 0-14.993 0 .75.75 0 0 1-1.5-.045 9.005 9.005 0 0 1 5.9-8.18A5.5 5.5 0 0 1 12 2.5ZM8 8a4 4 0 1 0 8 0 4 4 0 0 0-8 0Z"></path>  
                </svg>  
              </button>  

              <button className={`button ${isWishlistOpen ? 'active-dock' : ''}`} onClick={() => setIsWishlistOpen(true)} title="دڵخوازەکان">  
                <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="icon"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.04 3 5.5l7 7Z"></path></svg>  
              </button>  

              <button className={`button ${selectedCategory === 'Headset' ? 'active-dock' : ''}`} onClick={() => setSelectedCategory('Headset')} title="Headset">  
                <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="icon">  
                  <path d="M3 18v-6a9 9 0 0 1 18 0v6"></path>  
                  <path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3z"></path>  
                  <path d="M3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"></path>  
                </svg>  
              </button>  

              <button className={`button ${selectedCategory === 'Gaming' ? 'active-dock' : ''}`} onClick={() => setSelectedCategory('Gaming')} title="Gaming">  
                <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="icon">  
                  <line x1="6" y1="12" x2="10" y2="12"></line><line x1="8" y1="10" x2="8" y2="14"></line>  
                  <line x1="15" y1="13" x2="15.01" y2="13"></line><line x1="18" y1="11" x2="18.01" y2="11"></line>  
                  <rect x="2" y="6" width="20" height="12" rx="6"></rect>  
                </svg>  
              </button>  

              <button 
                className={`button home-center-btn ${selectedCategory === 'All' ? 'active-dock' : ''}`} 
                onClick={() => setSelectedCategory('All')} 
                title="سەرجەم بەرهەمەکان"
              >  
                <svg xmlns="http://www.w3.org/2000/svg" width="1.1em" height="1.1em" viewBox="0 0 1024 1024" fill="currentColor" className="icon">  
                  <path d="M946.5 505L560.1 118.8l-25.9-25.9a31.5 31.5 0 0 0-44.4 0L77.5 505a63.9 63.9 0 0 0-18.8 46c.4 35.2 29.7 63.3 64.9 63.3h42.5V940h691.8V614.3h43.4c17.1 0 33.2-6.7 45.3-18.8a63.6 63.6 0 0 0 18.7-45.3c0-17-6.7-33.1-18.8-45.2zM568 868H456V664h112v204zm217.9-325.7V868H632V640c0-22.1-17.9-40-40-40H432c-22.1 0-40 17.9-40 40v228H238.1V542.3h-96l370-369.7 23.1 23.1L882 542.3h-96.1z"></path>  
                </svg>  
              </button>  

              <button className={`button ${selectedCategory === 'Keyboard' ? 'active-dock' : ''}`} onClick={() => setSelectedCategory('Keyboard')} title="Keyboard">  
                <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="icon">  
                  <rect x="2" y="4" width="20" height="16" rx="2" ry="2"></rect>  
                  <line x1="6" y1="8" x2="6" y2="8"></line><line x1="10" y1="8" x2="10" y2="8"></line><line x1="14" y1="8" x2="14" y2="8"></line><line x1="18" y1="8" x2="18" y2="8"></line>  
                  <line x1="6" y1="12" x2="6" y2="12"></line><line x1="10" y1="12" x2="10" y2="12"></line><line x1="14" y1="12" x2="14" y2="12"></line><line x1="18" y1="12" x2="18" y2="12"></line>  
                  <line x1="8" y1="16" x2="16" y2="16"></line>  
                </svg>  
              </button>  

              <button className={`button ${selectedCategory === 'Mouse' ? 'active-dock' : ''}`} onClick={() => setSelectedCategory('Mouse')} title="Mouse">  
                <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="icon">  
                  <rect x="5" y="2" width="14" height="20" rx="7"></rect>  
                  <line x1="12" y1="6" x2="12" y2="10"></line>  
                </svg>  
              </button>  

              <button className={`button ${selectedCategory === 'Laptop' ? 'active-dock' : ''}`} onClick={() => setSelectedCategory('Laptop')} title="Laptop">  
                <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="icon">  
                  <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>  
                  <line x1="2" y1="20" x2="22" y2="20"></line>  
                </svg>  
              </button>  
            </div>  
          </div>  

          <div className="floating-lang-menu">  
            <input className="checkbox" type="checkbox" />  
            <span className="button-menu"></span>  
            <button className="option-a option" onClick={() => setLang('ku')}>کوردی</button>  
            <button className="option-b option" onClick={() => setLang('ar')}>عربي</button>  
            <button className="option-c option" onClick={() => setLang('en')}>EN</button>  
          </div>  

          <footer className="footer container">  
            <div className="footer-bottom">  
              <p>{t.rights}</p>  
            </div>  
          </footer>  

          {isWishlistOpen && (  
            <div className="modal-overlay" onClick={() => setIsWishlistOpen(false)}>  
              <div className="modal-content" onClick={(e) => e.stopPropagation()}>  
                <span className="close-modal" onClick={() => setIsWishlistOpen(false)}>✕</span>  
                <h2>{t.wishlistTitle}</h2>  
                {wishlistItems.length === 0 ? (  
                  <p style={{ color: 'var(--neutral-400)', marginTop: '1.25rem', textAlign: 'center' }}>{t.emptyWishlist}</p>  
                ) : (  
                  <div style={{ marginTop: '0.85rem', display: 'flex', flexDirection: 'column', gap: '0.6rem', maxHeight: '55vh', overflowY: 'auto' }}>  
                    {wishlistItems.map(item => (  
                      <div key={item.id} style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', background: 'rgba(255,255,255,0.04)', padding: '0.6rem', borderRadius: '8px' }}>  
                        <div style={{ display: 'flex', alignItems: 'center', gap: '0.6rem' }}>  
                          <img src={item.images[0]} alt={item.name} style={{ width: '42px', height: '42px', objectFit: 'cover', borderRadius: '6px' }} />  
                          <div>  
                            <div style={{ fontSize: '0.85rem', fontWeight: 'bold' }}>{item.name}</div>  
                            <div style={{ fontSize: '0.78rem', color: '#9333ea', fontWeight: 'bold' }}>${item.price}</div>  
                          </div>  
                        </div>  
                        <button onClick={() => setWishlistItems(wishlistItems.filter(w => w.id !== item.id))} style={{ color: '#dc2626', background: 'none', border: 'none', cursor: 'pointer', fontSize: '0.8rem' }}>سڕینەوە</button>  
                      </div>  
                    ))}  
                  </div>  
                )}  
              </div>  
            </div>  
          )}  

          {isAdminOpen && (  
            <div className="modal-overlay" onClick={() => setIsAdminOpen(false)}>  
              <div className="modal-content" onClick={(e) => e.stopPropagation()}>  
                <span className="close-modal" onClick={() => setIsAdminOpen(false)}>✕</span>  
                {!isAdminLoggedIn ? (  
                  <form onSubmit={handleAdminLogin} className="admin-form">  
                    <h2>{t.adminModalTitle}</h2>  
                    <p style={{ color: 'var(--neutral-400)', fontSize: '0.8rem' }}>{t.adminPasswordLabel}</p>  
                    <input type="password" className="admin-input" placeholder="••••" value={passwordInput} onChange={(e) => setPasswordInput(e.target.value)} />  
                    <button type="submit" className="btn btn-primary" style={{ width: '100%', justifyContent: 'center' }}>{t.loginBtn}</button>  
                  </form>  
                ) : (  
                  <div style={{ maxHeight: '70vh', overflowY: 'auto', paddingRight: '4px' }}>  
                    <h2>{t.adminDashboardTitle}</h2>  
                    
                    <form onSubmit={handleAddProductSubmit} className="admin-form" style={{ borderBottom: '1px solid var(--glass-border)', paddingBottom: '1rem' }}>  
                      <h4 style={{ color: '#9333ea', marginBottom: '0.2rem', fontSize: '0.9rem' }}>زیادکردنی بەرهەمی نوێ</h4>  
                      <input type="text" className="admin-input" placeholder={t.productNamePlaceholder} value={newTitle} onChange={(e) => setNewTitle(e.target.value)} />  
                      <input type="number" className="admin-input" placeholder={t.productPricePlaceholder} value={newPrice} onChange={(e) => setNewPrice(e.target.value)} />  
                      <input type="number" className="admin-input" placeholder={t.productOldPricePlaceholder} value={newOldPrice} onChange={(e) => setNewOldPrice(e.target.value)} />  
                      <input type="number" className="admin-input" placeholder={t.productDiscountPlaceholder} value={newDiscount} onChange={(e) => setNewDiscount(e.target.value)} />  
                      <input type="text" className="admin-input" placeholder={t.productSpecsPlaceholder} value={newSpecs} onChange={(e) => setNewSpecs(e.target.value)} />  
                      <select className="admin-input" value={newCategory} onChange={(e) => setNewCategory(e.target.value)}>  
                        <option value="Laptop">Laptop</option>  
                        <option value="Mouse">Mouse</option>  
                        <option value="Keyboard">Keyboard</option>  
                        <option value="Gaming">Gaming</option>  
                        <option value="Headset">Headset</option>  
                      </select>  
                      <label style={{ fontSize: '0.8rem', color: 'var(--neutral-200)' }}>{t.uploadImagesLabel}</label>  
                      <input type="file" multiple accept="image/*" className="admin-input" onChange={handleImageUpload} />  
                      <button type="submit" className="btn btn-primary" style={{ width: '100%', justifyContent: 'center' }}>{t.addProductBtn}</button>  
                    </form>  

                    <form onSubmit={handleAddHeroItem} className="admin-form" style={{ borderBottom: '1px solid var(--glass-border)', paddingBottom: '1rem', marginTop: '0.85rem' }}>  
                      <h4 style={{ color: '#9333ea', marginBottom: '0.2rem', fontSize: '0.9rem' }}>{t.manageHeroBanner}</h4>  
                      <input type="text" className="admin-input" placeholder={t.heroTitlePlaceholder} value={newHeroTitle} onChange={(e) => setNewHeroTitle(e.target.value)} />  
                      <input type="text" className="admin-input" placeholder={t.heroSubPlaceholder} value={newHeroSub} onChange={(e) => setNewHeroSub(e.target.value)} />  
                      <label style={{ fontSize: '0.8rem', color: 'var(--neutral-200)' }}>وێنەی بەشی سەرەوە</label>  
                      <input type="file" accept="image/*" className="admin-input" onChange={handleHeroImageUpload} />  
                      <button type="submit" className="btn btn-primary" style={{ width: '100%', justifyContent: 'center' }}>{t.addHeroBtn}</button>  
                    </form>  

                    <div style={{ marginTop: '0.85rem', borderBottom: '1px solid var(--glass-border)', paddingBottom: '1rem' }}>  
                      <h4 style={{ marginBottom: '0.4rem', fontSize: '0.85rem' }}>سڕینەوەی کارتەکانی بەشی سەرەوە</h4>  
                      <div style={{ maxHeight: '110px', overflowY: 'auto', display: 'flex', flexDirection: 'column', gap: '0.35rem' }}>  
                        {carouselImages.map(h => (  
                          <div key={h.id} style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', background: 'rgba(255,255,255,0.03)', padding: '0.35rem 0.6rem', borderRadius: '6px' }}>  
                            <span style={{ fontSize: '0.75rem' }}>{h.title}</span>  
                            <button onClick={() => handleDeleteHeroItem(h.id)} style={{ color: '#9333ea', fontSize: '0.75rem', background: 'none', border: 'none', cursor: 'pointer' }}>سڕینەوە</button>  
                          </div>  
                        ))}  
                      </div>  
                    </div>  

                    <div style={{ marginTop: '1rem' }}>  
                      <h4 style={{ marginBottom: '0.4rem', fontSize: '0.85rem' }}>بەڕێوەبردنی کاڵاکانی خوارەوە (قفڵکردن / سڕینەوە)</h4>  
                      <div style={{ maxHeight: '150px', overflowY: 'auto', display: 'flex', flexDirection: 'column', gap: '0.35rem' }}>  
                        {products.map(p => (  
                          <div key={p.id} style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', background: 'rgba(255,255,255,0.03)', padding: '0.4rem 0.6rem', borderRadius: '6px' }}>  
                            <span style={{ fontSize: '0.8rem' }}>{p.name} {p.isLocked && <span style={{ color: '#dc2626' }}>(قفڵکراو)</span>}</span>  
                            <div style={{ display: 'flex', gap: '0.6rem' }}>
                              <button onClick={() => handleToggleLockProduct(p.id)} style={{ color: p.isLocked ? '#34d399' : '#facc15', fontSize: '0.75rem', background: 'none', border: 'none', cursor: 'pointer' }}>{p.isLocked ? 'کردنەوە' : 'قفڵکردن'}</button>  
                              <button onClick={() => handleDeleteProduct(p.id)} style={{ color: '#dc2626', fontSize: '0.75rem', background: 'none', border: 'none', cursor: 'pointer' }}>{t.deleteProduct}</button>  
                            </div>
                          </div>  
                        ))}  
                      </div>  
                    </div>  
                  </div>  
                )}  
              </div>  
            </div>  
          )}  

          {isCartOpen && (  
            <div className="modal-overlay" onClick={() => setIsCartOpen(false)}>  
              <div className="modal-content" onClick={(e) => e.stopPropagation()}>  
                <span className="close-modal" onClick={() => setIsCartOpen(false)}>✕</span>  
                <h2>{t.cartTitle}</h2>  
                {cartItems.length === 0 ? (  
                  <p style={{ color: 'var(--neutral-400)', marginTop: '1.25rem', textAlign: 'center' }}>{t.emptyCart}</p>  
                ) : (  
                  <div style={{ marginTop: '0.85rem', display: 'flex', flexDirection: 'column', gap: '0.85rem' }}>  
                    <div style={{ maxHeight: '140px', overflowY: 'auto', display: 'flex', flexDirection: 'column', gap: '0.4rem' }}>  
                      {cartItems.map(item => (  
                        <div key={item.product.id} style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', background: 'rgba(255,255,255,0.04)', padding: '0.5rem', borderRadius: '6px' }}>  
                          <div>  
                            <div style={{ fontSize: '0.85rem', fontWeight: 'bold' }}>{item.product.name}</div>  
                            <div style={{ fontSize: '0.75rem', color: 'var(--neutral-400)' }}>${item.product.price}</div>  
                          </div>  
                          <div style={{ display: 'flex', alignItems: 'center', gap: '0.4rem' }}>  
                            <button onClick={() => updateQuantity(item.product.id, -1)} style={{ background: 'rgba(255,255,255,0.08)', color: 'white', width: '24px', height: '24px', borderRadius: '5px', display: 'flex', alignItems: 'center', justifyContent: 'center', cursor: 'pointer', fontWeight: 'bold' }}>-</button>  
                            <span style={{ minWidth: '18px', textAlign: 'center', fontWeight: 'bold', fontSize: '0.85rem' }}>{item.quantity}</span>  
                            <button onClick={() => updateQuantity(item.product.id, 1)} style={{ background: 'rgba(255,255,255,0.08)', color: 'white', width: '24px', height: '24px', borderRadius: '5px', display: 'flex', alignItems: 'center', justifyContent: 'center', cursor: 'pointer', fontWeight: 'bold' }}>+</button>  
                          </div>  
                        </div>  
                      ))}  
                    </div>  
                    <div style={{ borderTop: '1px solid var(--glass-border)', paddingTop: '0.6rem', display: 'flex', justifyContent: 'space-between', fontWeight: 'bold', fontSize: '0.9rem' }}>  
                      <span>کۆی گشتی / Total:</span>  
                      <span>${cartItems.reduce((acc, item) => acc + (item.product.price * item.quantity), 0)}</span>  
                    </div>  
                    
                    <div className="admin-form" style={{ marginTop: '0.4rem' }}>  
                      <input type="text" className="admin-input" placeholder={t.fullNameLabel} value={fullName} onChange={(e) => setFullName(e.target.value)} />  
                      <input type="text" className="admin-input" placeholder={t.addressLabel} value={address} onChange={(e) => setAddress(e.target.value)} />  
                      <input type="text" className="admin-input" placeholder={t.phoneLabel} value={phone} onChange={(e) => setPhone(e.target.value)} />  
                      <button className="btn" style={{ width: '100%', justifyContent: 'center', background: '#25D366', color: 'white', marginTop: '0.3rem', fontWeight: '700', fontSize: '0.85rem', height: '38px' }} onClick={handleWhatsAppCartOrder}>  
                        <Icon name="message-circle" size={16} /> {t.whatsappOrder}  
                      </button>  
                    </div>  
                  </div>  
                )}  
              </div>  
            </div>  
          )}  
  
          {selectedProductDetails && (  
            <div className="modal-overlay" onClick={() => setSelectedProductDetails(null)}>  
              <div className="daring-details-container" onClick={(e) => e.stopPropagation()}>  
                <button className="daring-close-btn" onClick={() => setSelectedProductDetails(null)}>✕</button>  
                
                <div className="daring-breadcrumb">  
                  <span>Home</span> / <span>{selectedProductDetails.category}</span> / <span>{selectedProductDetails.name}</span>  
                </div>  

                <div className="daring-brand-logo-row">  
                  <div className="daring-brand-logo-circle">  
                    <img src="logo.png" alt="brand" />  
                  </div>  
                  <span className="daring-brand-text">hama tech</span>  
                </div>  

                <h2 className="daring-title">{selectedProductDetails.name}</h2>  
                <div className="daring-price">${selectedProductDetails.price} د.ع</div>  

                <div className="daring-img-box">  
                  <img src={selectedProductDetails.images[detailsActiveImgIndex] || selectedProductDetails.images[0]} alt={selectedProductDetails.name} className="daring-img" />  
                </div>  

                {selectedProductDetails.images.length > 1 && (  
                  <div className="daring-thumbs">  
                    {selectedProductDetails.images.map((imgUrl, i) => (  
                      <div key={i} className={`daring-thumb ${detailsActiveImgIndex === i ? 'active' : ''}`} onClick={() => setDetailsActiveImgIndex(i)}>  
                        <img src={imgUrl} alt="thumb" />  
                      </div>  
                    ))}  
                  </div>  
                )}  

                <div className="daring-branches-box">  
                  <div className="daring-branch-row">  
                    <div className="branch-left">  
                      <span className="branch-icon">📍</span>  
                      <div>  
                        <div className="branch-name">hama tech Suli Store</div>  
                        <div className="branch-sub">Bakhtyari, Sulaymaniyah</div>  
                      </div>  
                    </div>  
                    <span className="branch-status-in">In Stock</span>  
                  </div>  

                  <div className="daring-branch-row">  
                    <div className="branch-left">  
                      <span className="branch-icon">📍</span>  
                      <div>  
                        <div className="branch-name">hama tech Erbil Store</div>  
                        <div className="branch-sub">Asaadi Mall, Erbil</div>  
                      </div>  
                    </div>  
                    <span className={selectedProductDetails.isLocked ? "branch-status-out" : "branch-status-in"}>  
                      {selectedProductDetails.isLocked ? "Out of Stock" : "In Stock"}  
                    </span>  
                  </div>  
                </div>  

                {!selectedProductDetails.isLocked && (  
                  <div className="daring-actions-row">  
                    <div className="daring-qty-box">  
                      <div className="daring-qty-btn" onClick={() => setProductQuantity(Math.max(1, productQuantity - 1))}>-</div>  
                      <div className="daring-qty-val">{productQuantity}</div>  
                      <div className="daring-qty-btn" onClick={() => setProductQuantity(productQuantity + 1)}>+</div>  
                    </div>  
                    <button className="daring-add-cart-btn" onClick={() => { handleAddToCart(selectedProductDetails, productQuantity); setSelectedProductDetails(null); }}>  
                      {t.addToCart}  
                    </button>  
                  </div>  
                )}  

                <button className="daring-whatsapp-btn" onClick={() => handleWhatsAppOrder(selectedProductDetails.name, selectedProductDetails.price, productQuantity)}>  
                  <Icon name="message-circle" size={16} /> {t.whatsappOrder}  
                </button>  

                <div className="daring-meta-info">  
                  <div>SKU: {selectedProductDetails.sku || '13512'}</div>  
                  <div>Category: {selectedProductDetails.category}</div>  
                  <div>Brand: hama tech</div>  
                </div>  

                <div className="daring-desc-box">  
                  <div className="daring-desc-title">Description</div>  
                  <div className="daring-desc-text">  
                    {selectedProductDetails.specs.join(' • ')}. High quality premium product designed for ultimate performance and durability.  
                  </div>  
                </div>  

              </div>  
            </div>  
          )}  
        </div>  
      );  
    }  
  
    ReactDOM.createRoot(default = document.getElementById('root')).render(<App />);  
  </script>  
</body>  
</html>
